<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="description" content="NIKOLA MD — Get your WhatsApp session code">
  <title>NIKOLA MD — Pair WhatsApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    /* ── Owner config — EDIT THESE TWO VALUES ── */
    /* After deploying your bot, change BOT_URL to your bot's URL         */
    /* and MASTER_PASSWORD to match your bot's settings.js                */
    /* (these are embedded in the page — anyone can read them, so use a   */
    /*  password you don't mind users knowing, or refactor to a backend)  */

    :root {
      --brand: #7c3aed;
      --brand-dark: #6d28d9;
      --brand-light: #8b5cf6;
      --accent: #06b6d4;
      --success: #10b981;
      --error: #ef4444;
      --bg: #0f0f17;
      --bg-card: #16161f;
      --bg-elevated: #1e1e2b;
      --bg-input: #12121a;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border: rgba(255,255,255,0.07);
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 20px;
      --shadow-xl: 0 20px 50px rgba(0,0,0,0.6);
      --transition: all 0.2s cubic-bezier(0.4,0,0.2,1);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text-primary);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .ambient {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 60% 40% at 20% 10%, rgba(124,58,237,0.15) 0%, transparent 60%),
        radial-gradient(ellipse 40% 30% at 80% 80%, rgba(6,182,212,0.08) 0%, transparent 50%);
    }

    .hidden { display: none !important; }

    .page {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .pair-shell {
      width: 100%;
      max-width: 420px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-xl);
      overflow: hidden;
      animation: fadeUp 0.5s cubic-bezier(0.4,0,0.2,1);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .brand-header {
      padding: 36px 32px 24px;
      text-align: center;
      background: linear-gradient(180deg, rgba(124,58,237,0.08) 0%, transparent 100%);
      border-bottom: 1px solid var(--border);
    }
    .brand-logo {
      font-size: 56px;
      line-height: 1;
      margin-bottom: 12px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.05); }
    }
    .brand-name {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(135deg, var(--brand-light), var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }
    .brand-sub {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .pair-body { padding: 28px 32px 32px; }

    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-input {
      width: 100%;
      padding: 16px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 18px;
      font-family: inherit;
      text-align: center;
      transition: var(--transition);
    }
    .form-input:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(124,58,237,0.15);
    }
    .form-input::placeholder { color: var(--text-muted); }
    .form-hint {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px 20px;
      border: none;
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: var(--transition);
      text-decoration: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(124,58,237,0.3);
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(124,58,237,0.4);
    }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: var(--bg-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: var(--bg-input);
      border-color: var(--brand);
    }
    .btn-full { width: 100%; }

    .alert {
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
      text-align: center;
    }
    .alert-info    { background: rgba(59,130,246,0.1);  border: 1px solid rgba(59,130,246,0.3);  color: #93c5fd; }
    .alert-success { background: rgba(16,185,129,0.1);  border: 1px solid rgba(16,185,129,0.3);  color: #6ee7b7; }
    .alert-error   { background: rgba(239,68,68,0.1);   border: 1px solid rgba(239,68,68,0.3);   color: #fca5a5; }

    /* Code display — tap to copy */
    .code-display {
      background: linear-gradient(135deg, rgba(124,58,237,0.1) 0%, rgba(6,182,212,0.06) 100%);
      border: 2px dashed var(--brand);
      border-radius: var(--radius-lg);
      padding: 32px 20px;
      text-align: center;
      margin: 20px 0;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
    }
    .code-display:hover {
      border-color: var(--brand-light);
      background: linear-gradient(135deg, rgba(124,58,237,0.15) 0%, rgba(6,182,212,0.1) 100%);
      transform: translateY(-1px);
    }
    .code-display:active { transform: translateY(0); }
    .code-display.copied {
      border-color: var(--success);
      background: rgba(16,185,129,0.1);
    }
    .code-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
    }
    .code-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 40px;
      font-weight: 700;
      letter-spacing: 6px;
      color: var(--brand-light);
      text-shadow: 0 0 20px rgba(124,58,237,0.4);
      margin-bottom: 8px;
      user-select: all;
    }
    .code-tap-hint {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .code-display.copied .code-tap-hint {
      color: var(--success);
    }
    .code-timer {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 8px;
    }
    .code-timer.urgent { color: var(--error); font-weight: 700; }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .whatsapp-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      padding: 12px;
      background: #25D366;
      color: white;
      text-decoration: none;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 14px;
      transition: var(--transition);
    }
    .whatsapp-link:hover {
      background: #1eb558;
      transform: translateY(-1px);
    }

    .pair-footer {
      padding: 16px 32px 24px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
    }
    .pair-footer a { color: var(--brand-light); text-decoration: none; font-weight: 500; }

    @media (max-width: 480px) {
      .pair-shell { max-width: 100%; }
      .brand-header { padding: 28px 24px 20px; }
      .pair-body { padding: 24px; }
      .code-value { font-size: 32px; letter-spacing: 4px; }
    }
  </style>
</head>
<body>
  <div class="ambient"></div>

  <div class="page">
    <div class="pair-shell">

      <!-- Brand Header -->
      <div class="brand-header">
        <div class="brand-logo">♻️</div>
        <div class="brand-name">NIKOLA MD</div>
        <div class="brand-sub">Get your WhatsApp session code</div>
      </div>

      <!-- Body -->
      <div class="pair-body">

        <!-- Alert area -->
        <div id="alert" class="alert hidden"></div>

        <!-- Input form -->
        <div id="inputView">
          <div class="form-group">
            <label class="form-label" for="phone">📱 WhatsApp Number</label>
            <input
              type="tel"
              id="phone"
              class="form-input"
              placeholder="254712345678"
              required
              autocomplete="tel"
              pattern="[0-9+]+"
              inputmode="numeric"
              title="Enter your full phone number with country code"
            >
            <p class="form-hint">Include country code, no spaces or symbols</p>
          </div>

          <button type="button" class="btn btn-primary btn-full" id="generateBtn" onclick="generateCode()">
            <span>🔗 Generate Session Code</span>
          </button>
        </div>

        <!-- Code view (hidden initially) -->
        <div id="codeView" class="hidden">
          <div class="code-display" id="codeBox" onclick="copyCode()">
            <div class="code-label">Your Pairing Code</div>
            <div class="code-value" id="codeValue">• • • • • •</div>
            <div class="code-tap-hint" id="tapHint">👆 Tap to copy</div>
            <div class="code-timer" id="codeTimer">Expires in 2:00</div>
          </div>

          <a href="https://wa.me/settings/linked_devices" class="whatsapp-link" target="_blank">
            💬 Open WhatsApp Linked Devices
          </a>

          <button type="button" class="btn btn-secondary btn-full" style="margin-top:12px;" onclick="resetForm()">
            ➕ Generate Another Code
          </button>
        </div>

      </div>

      <!-- Footer -->
      <div class="pair-footer">
        ♻️ <strong>NIKOLA MD</strong> — Multi-Session WhatsApp Bot
      </div>

    </div>
  </div>

  <script>
    // ════════════════════════════════════════════════════════════
    // ⚠️  OWNER CONFIGURATION — EDIT THESE TWO VALUES  ⚠️
    // ════════════════════════════════════════════════════════════
    //
    // 1. BOT_URL: The URL where your NIKOLA MD bot is running
    //    Example: 'https://nikola-md-bot.herokuapp.com'
    //             (no trailing slash)
    //
    // 2. MASTER_PASSWORD: Must match MASTER_PASSWORD in your bot's
    //    settings.js so the pair site can call the bot's API.
    //
    // Change these after you deploy your bot, then commit & push
    // to update the live GitHub Pages site.
    // ════════════════════════════════════════════════════════════

    const BOT_URL = 'https://nikola-md-bot.herokuapp.com';
    const MASTER_PASSWORD = '123456';

    // ════════════════════════════════════════════════════════════
    // End of owner config — don't edit below unless you know JS
    // ════════════════════════════════════════════════════════════

    let currentPhone = '';
    let countdownInterval = null;
    let pairingCodeInterval = null;
    let pairingStatusInterval = null;
    let codeExpiresAt = 0;

    function showAlert(message, type) {
      const el = document.getElementById('alert');
      el.className = 'alert alert-' + type;
      el.textContent = message;
      el.classList.remove('hidden');
    }

    function hideAlert() {
      document.getElementById('alert').classList.add('hidden');
    }

    // ── Generate the pairing code ──
    async function generateCode() {
      const phoneInput = document.getElementById('phone').value.trim();
      const phone = phoneInput.replace(/[^\d]/g, '');
      const btn = document.getElementById('generateBtn');

      if (phone.length < 7 || phone.length > 15) {
        showAlert('⚠️ Invalid number. Use format: 254712345678', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Generating...';
      hideAlert();

      try {
        const res = await fetch(BOT_URL + '/api/register-session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: MASTER_PASSWORD, phone })
        });

        const data = await res.json();

        if (!res.ok) {
          showAlert('❌ ' + (data.error || 'Failed to generate code. Is the bot online?'), 'error');
          btn.disabled = false;
          btn.innerHTML = '<span>🔗 Generate Session Code</span>';
          return;
        }

        currentPhone = phone;

        // Switch to code view
        document.getElementById('inputView').classList.add('hidden');
        document.getElementById('codeView').classList.remove('hidden');

        // Show pairing code if available
        if (data.pairingCode) {
          document.getElementById('codeValue').textContent = data.pairingCode;
        }

        // Start 2-minute countdown
        codeExpiresAt = Date.now() + 2 * 60 * 1000;
        startCountdown();
        startPolling();

      } catch (error) {
        showAlert('❌ Cannot reach bot. Check your internet or try again later.', 'error');
        btn.disabled = false;
        btn.innerHTML = '<span>🔗 Generate Session Code</span>';
      }
    }

    // ── Countdown timer ──
    function startCountdown() {
      if (countdownInterval) clearInterval(countdownInterval);
      const timerEl = document.getElementById('codeTimer');

      const update = () => {
        const remaining = Math.max(0, codeExpiresAt - Date.now());
        if (remaining <= 0) {
          timerEl.textContent = '⏰ Code expired — generate a new one';
          timerEl.classList.add('urgent');
          clearInterval(countdownInterval);
          countdownInterval = null;
          stopPolling();
          return;
        }
        const mins = Math.floor(remaining / 60000);
        const secs = Math.floor((remaining % 60000) / 1000);
        timerEl.textContent = `Expires in ${mins}:${secs.toString().padStart(2, '0')}`;
        if (remaining < 30000) timerEl.classList.add('urgent');
      };

      update();
      countdownInterval = setInterval(update, 1000);
    }

    // ── Poll for code updates + pairing status ──
    function startPolling() {
      const pollCode = async () => {
        try {
          const res = await fetch(BOT_URL + '/api/pairing-code', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: currentPhone, password: MASTER_PASSWORD })
          });
          if (res.status === 404) return;
          const data = await res.json();
          if (res.ok && data.code) {
            const codeEl = document.getElementById('codeValue');
            if (codeEl.textContent !== data.code) {
              codeEl.textContent = data.code;
            }
          }
        } catch {}
      };

      const pollStatus = async () => {
        try {
          const res = await fetch(BOT_URL + '/api/pairing-status', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: currentPhone, password: MASTER_PASSWORD })
          });
          const data = await res.json();
          if (res.ok && data.paired) {
            stopPolling();
            if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
            showAlert('✅ Successfully linked! You can now use the bot.', 'success');
            document.getElementById('codeTimer').textContent = '✅ Linked successfully';
            document.getElementById('codeTimer').classList.remove('urgent');
          }
        } catch {}
      };

      pollCode();
      pollStatus();
      pairingCodeInterval = setInterval(pollCode, 5000);
      pairingStatusInterval = setInterval(pollStatus, 3000);
    }

    function stopPolling() {
      if (pairingCodeInterval) { clearInterval(pairingCodeInterval); pairingCodeInterval = null; }
      if (pairingStatusInterval) { clearInterval(pairingStatusInterval); pairingStatusInterval = null; }
    }

    // ── Tap to copy ──
    function copyCode() {
      const code = document.getElementById('codeValue').textContent;
      const box = document.getElementById('codeBox');
      const hint = document.getElementById('tapHint');

      if (!code || code.includes('•')) return;

      // Try modern clipboard API
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(() => {
          box.classList.add('copied');
          hint.innerHTML = '✓ Copied! Paste in WhatsApp';
          setTimeout(() => {
            box.classList.remove('copied');
            hint.innerHTML = '👆 Tap to copy';
          }, 2500);
        }).catch(() => {
          fallbackCopy(code, box, hint);
        });
      } else {
        fallbackCopy(code, box, hint);
      }
    }

    function fallbackCopy(code, box, hint) {
      // Fallback for older browsers
      const ta = document.createElement('textarea');
      ta.value = code;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        box.classList.add('copied');
        hint.innerHTML = '✓ Copied! Paste in WhatsApp';
        setTimeout(() => {
          box.classList.remove('copied');
          hint.innerHTML = '👆 Tap to copy';
        }, 2500);
      } catch (e) {
        hint.innerHTML = 'Long-press to copy';
      }
      document.body.removeChild(ta);
    }

    // ── Reset form ──
    function resetForm() {
      stopPolling();
      if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
      currentPhone = '';
      document.getElementById('phone').value = '';
      document.getElementById('codeValue').textContent = '• • • • • •';
      document.getElementById('codeTimer').textContent = 'Expires in 2:00';
      document.getElementById('codeTimer').classList.remove('urgent');
      document.getElementById('tapHint').innerHTML = '👆 Tap to copy';
      document.getElementById('codeBox').classList.remove('copied');
      document.getElementById('codeView').classList.add('hidden');
      document.getElementById('inputView').classList.remove('hidden');
      document.getElementById('generateBtn').disabled = false;
      document.getElementById('generateBtn').innerHTML = '<span>🔗 Generate Session Code</span>';
      hideAlert();
      document.getElementById('phone').focus();
    }

    // Enter key triggers generate
    document.getElementById('phone').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') generateCode();
    });

    // Auto-focus on load
    document.getElementById('phone').focus();
  </script>
</body>
</html>
